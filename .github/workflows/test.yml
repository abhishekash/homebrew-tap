name: Homebrew formula

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    name: Binary install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@70b5b34b56f36e0f19ef154095b3c0cbb03089a3 # main
      - name: Verify this checkout is the tap
        run: test "$(git -C "$(brew --repository abhishekash/tap)" rev-parse HEAD)" = "$(git rev-parse HEAD)"
      - name: Install the published formula archive
        run: brew install abhishekash/tap/agenturm
      - name: Verify installed command, plugin host, and Codex/Pi collection
        run: brew test --verbose abhishekash/tap/agenturm
      - name: Check formula style
        run: brew style Formula/agenturm.rb

  source:
    name: Source build and bottle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@70b5b34b56f36e0f19ef154095b3c0cbb03089a3 # main
        with:
          core: shallow
      - name: Verify this checkout is the tap
        run: test "$(git -C "$(brew --repository abhishekash/tap)" rev-parse HEAD)" = "$(git rev-parse HEAD)"
      - name: Check source formula style and candidate parity
        shell: bash
        run: |
          set -euo pipefail
          brew style Formula/agenturm-source.rb
          sed 's/^class AgenturmSource < Formula$/class Agenturm < Formula/' Formula/agenturm-source.rb | diff - core-candidate/agenturm.rb
      - name: Build Agenturm from the pinned source release
        run: HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-bottle abhishekash/tap/agenturm-source
      - name: Verify source-built binary, shared SQLite, and Codex/Pi collection
        run: brew test --verbose abhishekash/tap/agenturm-source
      - name: Audit new source formula
        run: brew audit --strict --new --online --formula abhishekash/tap/agenturm-source
      - name: Verify livecheck detects the stable Rust release
        run: brew livecheck --debug abhishekash/tap/agenturm-source
      - name: Bottle and reinstall
        shell: bash
        run: |
          set -euo pipefail
          brew bottle --json abhishekash/tap/agenturm-source
          brew uninstall --force agenturm-source
          bottles=(./agenturm-source--*.bottle.tar.gz)
          test "${#bottles[@]}" -eq 1
          brew install "${bottles[0]}"
          brew test --verbose abhishekash/tap/agenturm-source
          brew postinstall abhishekash/tap/agenturm-source
          brew test --verbose abhishekash/tap/agenturm-source
