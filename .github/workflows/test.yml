name: Homebrew formula

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: Install and smoke-test on Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify native runner
        run: test "$(uname -m)" = arm64
      - name: Install the published formula archive
        run: brew install --build-from-source --formula ./Formula/agenturm.rb
      - name: Verify installed command, plugin host, and Codex/Pi collection
        run: brew test --verbose ./Formula/agenturm.rb
      - name: Check formula style
        run: brew style --fix=false Formula/agenturm.rb
